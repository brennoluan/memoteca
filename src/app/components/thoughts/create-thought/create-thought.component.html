<section class="container criar-pensamentos ff-inter">
    <header class="header">
        <h2>Adicione um <br>pensamento novo</h2>
    </header>
    <form action="">
        <label for="thought">Pensamento</label>
        <input type="text" id="thought" name="thought" class="input" placeholder="Digite o pensamento" [(ngModel)]="thought.content">
        
        <label for="author">Autoria ou fonte</label>
        <input type="text" id="author" name="author" class="input" placeholder="Digite a autoria ou fonte" [(ngModel)]="thought.author">
    
        <label for="model">Selecione o modelo do card:</label>
        <div class="container-radio">
            <div class="radio-modelo">
                <label for="model1">
                    <input type="radio" id="model1" name="model-card" [(ngModel)]="thought.model" value="model1">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 1</span>
                </label>
                Prévia:
                <div class="modelo modelo1 ff-roboto-mono">
                    <img src="/assets/imagens/modelo1.png" alt="Aspas azuis">
                    <p class="conteudo">{{thought.content}}</p>
                    <p class="autoria"><strong>{{thought.author}}</strong></p>
                </div>
            </div>

            <div class="radio-modelo">
                <label for="model2">
                    <input type="radio" id="model2" name="model-card" [(ngModel)]="thought.model" value="model2">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 2</span>
                </label>
                Prévia:
                <div class="modelo modelo2 ff-roboto-mono">
                    <img src="/assets/imagens/modelo2.png" alt="Aspas azul claro">
                    <p class="conteudo">{{thought.content}}</p>
                    <p class="autoria"><strong>{{thought.author}}</strong></p>
                </div>
            </div>

            <div class="radio-modelo">
                <label for="model3">
                    <input type="radio" id="model3" name="model-card" [(ngModel)]="thought.model" value="model3">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 3</span>
                </label>
                Prévia:
                <div class="modelo modelo3 ff-roboto-mono">
                    <img src="/assets/imagens/modelo3.png" alt="Aspas verdes">
                    <p class="conteudo">{{thought.content}}</p>
                    <p class="autoria"><strong>{{thought.author}}</strong></p>
                </div>
            </div>
        </div>
        <div class="acoes">
            <button (click)="createThought()" class="botao">Salvar</button>
            <button (click)="cancel()" routerLink="/listarPensamento" class="botao">Cancelar</button>
        </div>
    </form>
</section>
