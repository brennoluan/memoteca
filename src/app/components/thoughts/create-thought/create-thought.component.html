<section class="container criar-pensamentos ff-inter">
    <header class="header">
        <h2>Adicione um <br>pensamento novo</h2>
    </header>
    <form [formGroup]="form">
        <label for="thought">Pensamento</label>
        <input type="text" id="thought" name="thought" class="input" placeholder="Digite o pensamento" formControlName="conteudo">
        
        <label for="author">Autoria ou fonte</label>
        <input type="text" id="author" name="author" class="input" placeholder="Digite a autoria ou fonte" formControlName="autoria">
    
        <label for="model">Selecione o modelo do card:</label>
        <div class="container-radio">
            <div class="radio-modelo">
                <label for="model1">
                    <input type="radio" id="model1" value="modelo1" formControlName="modelo">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 1</span>
                </label>
                Prévia:
                <div class="modelo modelo1 ff-roboto-mono">
                    <img src="/assets/imagens/modelo1.png" alt="Aspas azuis">
                    <p class="conteudo">{{form.get('conteudo')?.value}}</p>
                    <p class="autoria"><strong>{{form.get('autoria')?.value}}</strong></p>
                </div>
            </div>

            <div class="radio-modelo">
                <label for="model2">
                    <input type="radio" id="model2" value="modelo2" formControlName="modelo">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 2</span>
                </label>
                Prévia:
                <div class="modelo modelo2 ff-roboto-mono">
                    <img src="/assets/imagens/modelo2.png" alt="Aspas azul claro">
                    <p class="conteudo">{{form.get('conteudo')?.value}}</p>
                    <p class="autoria"><strong>{{form.get('autoria')?.value}}</strong></p>
                </div>
            </div>

            <div class="radio-modelo">
                <label for="model3">
                    <input type="radio" id="model3" value="modelo3" formControlName="modelo">
                    <div class="custom-radio">
                        <span></span>
                    </div>
                    <span>Modelo 3</span>
                </label>
                Prévia:
                <div class="modelo modelo3 ff-roboto-mono">
                    <img src="/assets/imagens/modelo3.png" alt="Aspas verdes">
                    <p class="conteudo">{{form.get('conteudo')?.value}}</p>
                    <p class="autoria"><strong>{{form.get('autoria')?.value}}</strong></p>
                </div>
            </div>
        </div>
        <div class="acoes">
            <button (click)="createThought()" class="botao">Salvar</button>
            <button (click)="cancel()" class="botao">Cancelar</button>
        </div>
    </form>
</section>
