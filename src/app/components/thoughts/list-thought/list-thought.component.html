<section class="container">
    <header class="header d-flex">
        <div class="buscar-pensamentos">
            <input type="search" class="filtro" placeholder="O que você procura?" autofocus [(ngModel)]="filter" (keyup)="searchThoughts()">
        <img src="/assets/imagens/lupa.png" alt="Lupa Azul">
        </div>
        <h2 class="ff-inter">Meu Mural</h2>
        <div class="botoes">
            <button class="botao">Meu Mural</button>
            <button class="botao" (click)="listFavorites()">Meus favoritos</button>
            <button routerLink="/criarPensamento" class="botao">Novo pensamento</button>
        </div>
         </header>
    <div class="mural" *ngIf="listThoughts.length > 0; else noThoughts">
        <div *ngFor="let thought of listThoughts">
            <app-thought [thought]="thought" [listFavorite]="listFavorite"></app-thought>
        </div>
    </div>
</section>
<app-button-load-more [haveMoreThoughts]="haveMoreThoughts" (click)="loadMoreThoughts()"></app-button-load-more>
<ng-template #noThoughts>
    <div class="ff-inter sem-pensamentos">
        <p>Ainda não há pensamentos cadastrados!</p>
    </div>
</ng-template>
