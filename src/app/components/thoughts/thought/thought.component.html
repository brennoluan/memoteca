<div class="pensamento {{thought.modelo}} ff-roboto-mono" [ngClass]="widthThought()">
    <img src="/assets/imagens/{{thought.modelo}}.png" alt="Aspas colorida">
    <p class="conteudo">{{thought.conteudo}}</p>
    <p class="autoria"><strong>{{thought.autoria}}</strong></p>
    <div class="acoes">
        <button class="botao-editar" routerLink="/pensamentos/editarPensamento/{{thought.id}}">
            <img src="/assets/imagens/icone-editar.png" alt="icone de editar">
        </button>
        <button class="botao-excluir" routerLink="/pensamentos/excluirPensamento/{{thought.id}}">
            <img src="/assets/imagens/icone-excluir.png" alt="icone de excluir">
        </button>
    </div>
</div>
